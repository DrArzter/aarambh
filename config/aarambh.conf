# Aarambh boot menu configuration
#
# entry <title> | <loader> | <logo> | <background> | <key> | <accent>
#
#   loader      EFI path of the OS loader, or @firmware, @reboot, @shutdown
#   logo        PNG, relative to \EFI\aarambh\
#   background  JPEG or PNG, relative to \EFI\aarambh\
#   key         OS id (/etc/os-release ID), used for <key>.kernels
#   accent      Optional color, e.g. #e95420
#
# Linux entries are added by hooks/setup.sh on each installation. With
# "autodetect yes", loaders found under \EFI\ that no entry uses (Windows,
# other Linux installs) are added at boot.
#
# default is an OS key (ubuntu, fedora, windows), a menu title or an index.
# Change theme, default and timeout from any connected OS with:
#   aarambh --theme cinema --default fedora --timeout 5

theme accordion
timeout 10
default 0
autodetect yes
edit yes

font_light fonts/light.ttf
font_regular fonts/regular.ttf
font_bold fonts/bold.ttf
font_mono fonts/mono.ttf

entry Firmware  | @firmware | logos/settings.png | backgrounds/settings.jpg |  | #8a90a8
entry Restart   | @reboot   | logos/restart.png  | backgrounds/restart.jpg  |  | #2a9d8f
entry Power Off | @shutdown | logos/power.png    | backgrounds/power.jpg    |  | #c0392b