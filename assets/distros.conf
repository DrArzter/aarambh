# Distributions Aarambh knows by name.
#
# id | menu title | accent | wallpaper top | wallpaper bottom
#
# id        The ID= value from /etc/os-release. Logos and backgrounds are looked
#           up by this id: logos/<id>.png, backgrounds/<id>.jpg,
#           plymouth/<id>/. A distribution missing here falls back to the ids
#           in its ID_LIKE=, then to its NAME= and a generated look.
# accent    Accent bar and fallback background color.
# top/bottom Wallpaper gradient. Leave empty to derive both from the accent.
#
# Flavours that share their parent's ID (Kubuntu, Xubuntu and Lubuntu all
# report ID=ubuntu) use the parent's entry. Check a system with:
#   grep -E '^(ID|ID_LIKE)=' /etc/os-release
#
# windows and linux are not distributions: they are the keys autodetect gives
# to \EFI\Microsoft and to an unnamed GRUB, listed here so their logos render.

